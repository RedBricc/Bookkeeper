vaadin:
  launch-browser: false
spring:
  application:
    name: bookkeeper
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/vallterra
    username: bookkeeper
    password: admin
  threads:
    virtual:
      enabled: true
  jooq:
    sql-dialect: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 9696
logging:
  level:
    web: info
    sql: info
