volumes:
  pgdata:

networks:
  web:
    driver: bridge

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: gradle test --no-daemon -x compileJava -x vaadinPrepareFrontend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
  bookkeeper:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      tests:
        condition: service_completed_successfully
    ports:
      - "9696:9696"
    env_file:
      - /etc/vallterra/vallterra.env
    networks: [ web ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "https://127.0.0.1:9696/actuator/health" ]
      interval: 30s
      retries: 3
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    depends_on:
      bookkeeper:
        condition: service_healthy
    ports: 
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./devops/certs/bookkeeper:/etc/nginx/certs/bookkeeper:ro
      - ./devops/certs/wiki:/etc/nginx/certs/wiki:ro
    networks: [ web ]
    restart: unless-stopped
