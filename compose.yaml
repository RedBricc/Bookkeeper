volumes:
  pgdata:

networks:
  web:
    driver: bridge

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookkeeper
      POSTGRES_USER: bookkeeper
      POSTGRES_PASSWORD: admin
    ports:
      - "4321:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bookkeeper" ]
      interval: 5s
      retries: 5
  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: >
      gradle test --no-daemon
      -Dgen.db.url=jdbc:postgresql://host.docker.internal:4321/bookkeeper_gen
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
  bookkeeper:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      tests:
        condition: service_completed_successfully
    ports:
      - "9696:9696"
    networks: [ web ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "-s", "https://127.0.0.1:9696/actuator/health" ]
      interval: 30s
      retries: 3
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    depends_on:
      bookkeeper:
        condition: service_healthy
    ports: 
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs/bookkeeper:/etc/nginx/certs/bookkeeper:ro
      - ./certs/wiki:/etc/nginx/certs/wiki:ro
    networks: [ web ]
    restart: unless-stopped
