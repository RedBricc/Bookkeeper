error_log  /var/log/nginx/error.log info;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/*.conf;
}