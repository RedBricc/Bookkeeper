# Managed alongside /home/deploy/file-media. Only these two hosts are affected.
server {
    listen 80;
    server_name files.vallterra.wiki media.vallterra.wiki;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/wiki/file-media/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.vallterra.wiki;
    ssl_certificate /etc/nginx/certs/wiki/file-media/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wiki/file-media/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_ecdh_curve X25519:secp256r1;

    # Resolve on requests so this proxy can start while the apps are offline.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $file_media_backend file-media-filestash:8334;
    client_max_body_size 0;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/wiki/file-media/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://$file_media_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.vallterra.wiki;
    ssl_certificate /etc/nginx/certs/wiki/file-media/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wiki/file-media/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_ecdh_curve X25519:secp256r1;

    # Resolve on requests so this proxy can start while the apps are offline.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $file_media_backend file-media-jellyfin:8096;
    client_max_body_size 0;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/wiki/file-media/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://$file_media_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
