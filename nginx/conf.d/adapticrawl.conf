server {
    listen 80;
    server_name adapticrawl.vallterra.wiki;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name adapticrawl.vallterra.wiki;

    ssl_certificate /etc/nginx/certs/adapticrawl/cert.pem;
    ssl_certificate_key /etc/nginx/certs/adapticrawl/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    location / {
        # Proxy to the Adapticrawl dashboard running on port 8020
        proxy_pass http://host.docker.internal:8020;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_buffering off;
    }
}