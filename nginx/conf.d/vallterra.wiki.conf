server {
    listen 80;
    server_name vallterra.wiki;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vallterra.wiki;

    ssl_certificate     /etc/nginx/certs/wiki/cert.pem;
    ssl_certificate_key /etc/nginx/certs/wiki/cert.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:
                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                 ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    ssl_ecdh_curve X25519:secp256r1:secp384r1;

    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://host.docker.internal:9001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering off;
    }
}